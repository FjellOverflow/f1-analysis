[project]
name = "f1-analysis"
version = "0.1.0"
description = ""
authors = [
    {name = "FjellOverflow",email = "fjelloverflow@protonmail.com"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = ["requests (>=2.34.2,<3.0.0)", "jupyter (>=1.1.1,<2.0.0)", "pandas (>=2.3.3,<3.0.0)", "plotly (>=7.1.0,<7.1.1)", "fastf1 (>=3.9.0,<4.0.0)"]

[tool.poetry]
packages = [{include = "f1_analysis", from = "src"}]

[tool.pyrefly]
project-includes = ["**/*"]
project-excludes = [
    "**/node_modules",
    "**/__pycache__",
    "**/*venv/**/*",
]

[tool.sqlfluff.core]
dialect = "sqlite"

[build-system]
requires = ["poetry-core>=2.5.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ruff (>=0.17.3,<0.17.4)",
    "pyrefly (>=1.4.0,<1.4.1)",
    "pre-commit (>=4.7.0,<5.0.0)",
    "sqlfluff (>=4.5.0,<4.5.1)"
]